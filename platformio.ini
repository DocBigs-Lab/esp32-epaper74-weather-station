; Wetterstation mit Open-Meteo auf dem SES-imagotag 7,4" BWR
; Board: Waveshare e-Paper ESP32 Driver Board (SKU 15823), Schalter 1 = B, 2 = ON
; WLAN und Ort: include/secrets.h (Vorlage include/secrets.example.h)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Standard: Treiber in fester Version von GitHub
[env:esp32dev]
lib_deps =
    https://github.com/DocBigs-Lab/ses-imagotag-7in4-bwr-epaper.git#v1.0.0
    bblanchon/ArduinoJson@^7.2.0

; Entwicklung: Treiber aus dem Nachbarordner ../ses-imagotag-7in4-bwr-epaper
[env:lokal]
lib_deps =
    symlink://../ses-imagotag-7in4-bwr-epaper
    bblanchon/ArduinoJson@^7.2.0
